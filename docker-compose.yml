# Run everything:  cp .env.example .env  (then set JWT_SECRET)  &&  docker compose up --build
# Open http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: daybook
      POSTGRES_USER: daybook
      POSTGRES_PASSWORD: ${DB_PASSWORD:-daybook}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daybook -d daybook"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/daybook
      DB_USER: daybook
      DB_PASSWORD: ${DB_PASSWORD:-daybook}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
